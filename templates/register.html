{% extends 'base.html' %}

{% block hero %}{% endblock %}

{% block content %}
<section class="auth-page">
    <form class="auth-card" id="register_form" action="{{ url_for('register', state=request.args.get('state', 'volunteer')) }}" method="post" data-register-url="{{ url_for('register') }}">
        {{ form.hidden_tag() }}

        <input type="hidden" name="role" id="selected_role" value="{{ request.args.get('state', 'volunteer') }}">

        <div class="reg_label">
            <h2>Регистрация</h2>
        </div>

        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}

        <div class="role-switch" aria-label="Выбор типа регистрации">
            <button class="role-option {% if request.args.get('state') == 'volunteer' %}role-option-active{% endif %}" type="button" data-role="volunteer" aria-pressed="{% if request.args.get('state') == 'volunteer' %}true{% else %}false{% endif %}">
                Волонтёр
            </button>
            <button class="role-option {% if request.args.get('state') == 'organization' %}role-option-active{% endif %}" type="button" data-role="organization" aria-pressed="{% if request.args.get('state') == 'organization' %}true{% else %}false{% endif %}">
                Организация
            </button>
        </div>

        <div class="role-content {% if request.args.get('state') == 'volunteer' %}role-content-active{% endif %}" data-content="volunteer">
            <div class="volunteer-fields">
                <label class="form-field" for="name">
                    {{ form.name.label }}
                    {{ form.name(id="name", placeholder="Введите ваше имя", autocomplete="given-name", disabled=(request.args.get('state') != 'volunteer')) }}
                </label>
                <label class="form-field" for="email">
                    {{ form.email.label }}
                    {{ form.email(id="email", placeholder="Введите почту", autocomplete="email", disabled=(request.args.get('state') != 'volunteer')) }}
                </label>
                <label class="form-field" for="password">
                    {{ form.password.label }}
                    {{ form.password(id="password", placeholder="Введите пароль", autocomplete="new-password", disabled=(request.args.get('state') != 'volunteer')) }}
                </label>
                <label class="form-field" for="password_again">
                    {{ form.password_again.label }}
                    {{ form.password_again(id="password_again", placeholder="Повторите пароль", autocomplete="new-password", disabled=(request.args.get('state') != 'volunteer')) }}
                </label>
                <label class="form-field" for="info">
                    {{ form.info.label }}
                    {{ form.info(id="info", placeholder="Расскажите о себе", rows="5", disabled=(request.args.get('state') != 'volunteer')) }}
                </label>

                {% if form.birth_date %}
                <label class="form-field" for="birth_date">
                    {{ form.birth_date.label }}
                    {{ form.birth_date(id="birth_date", type="date", disabled=(request.args.get('state') != 'volunteer')) }}
                </label>
                {% endif %}

                <label class="form-field" for="phone_number">
                    {{ form.phone_number.label }}
                    {{ form.phone_number(id="phone_number", placeholder="Введите номер телефона", autocomplete="tel", disabled=(request.args.get('state') != 'volunteer')) }}
                </label>
            </div>
        </div>

        <div class="role-content {% if request.args.get('state') == 'organization' %}role-content-active{% endif %}" data-content="organization">
            <div class="volunteer-fields">
                <label class="form-field" for="name_org">
                    {{ form.name.label }}
                    {{ form.name(id="name_org", placeholder="Введите название организации", disabled=(request.args.get('state') != 'organization')) }}
                </label>
                <label class="form-field" for="email_org">
                    {{ form.email.label }}
                    {{ form.email(id="email_org", placeholder="Введите почту", autocomplete="email", disabled=(request.args.get('state') != 'organization')) }}
                </label>
                <label class="form-field" for="password_org">
                    {{ form.password.label }}
                    {{ form.password(id="password_org", placeholder="Введите пароль", autocomplete="new-password", disabled=(request.args.get('state') != 'organization')) }}
                </label>
                <label class="form-field" for="password_org_again">
                    {{ form.password_again.label }}
                    {{ form.password_again(id="password_org_again", placeholder="Повторите пароль", autocomplete="new-password", disabled=(request.args.get('state') != 'organization')) }}
                </label>
                <label class="form-field" for="info_org">
                    {{ form.info.label }}
                    {{ form.info(id="info_org", placeholder="Расскажите об организации", rows="5", disabled=(request.args.get('state') != 'organization')) }}
                </label>
                <label class="form-field" for="phone_number_org">
                    {{ form.phone_number.label }}
                    {{ form.phone_number(id="phone_number_org", placeholder="Введите номер телефона", autocomplete="tel", disabled=(request.args.get('state') != 'organization')) }}
                </label>

                {% if form.address %}
                <label class="form-field" for="address">
                    {{ form.address.label }}
                    {{ form.address(id="address", placeholder="Введите адрес", disabled=(request.args.get('state') != 'organization')) }}
                </label>
                {% endif %}
            </div>
        </div>

        <button class="auth_button" type="submit">Зарегистрироваться</button>
    </form>
</section>

<script>
    const registerForm = document.getElementById('register_form');
    const selectedRoleInput = document.getElementById('selected_role');

    function setRegisterRole(selectedRole, shouldNotifyBackend = true) {
        selectedRoleInput.value = selectedRole;

        registerForm.action = `${registerForm.dataset.registerUrl}?state=${selectedRole}`;

        document.querySelectorAll('.role-option').forEach((item) => {
            const isActive = item.dataset.role === selectedRole;
            item.classList.toggle('role-option-active', isActive);
            item.setAttribute('aria-pressed', String(isActive));
        });

        document.querySelectorAll('.role-content').forEach((content) => {
            const isActive = content.dataset.content === selectedRole;
            content.classList.toggle('role-content-active', isActive);

            content.querySelectorAll('input, textarea, select').forEach((field) => {
                if (field.type !== 'hidden') {
                    field.disabled = !isActive;
                }
            });
        });

        if (shouldNotifyBackend) {
            const newUrl = `${window.location.pathname}?state=${selectedRole}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }
    }

    document.querySelectorAll('.role-option').forEach((button) => {
        button.addEventListener('click', () => {
            setRegisterRole(button.dataset.role);
        });
    });

    setRegisterRole(selectedRoleInput.value, false);
</script>
{% endblock content %}
