{% extends 'base.html' %}

{% block hero %}{% endblock %}

{% block content %}
<section class="auth-page">
    <form class="auth-card" id="register_form" action="{{ url_for('register', state='volunteer') }}" method="post" data-register-url="{{ url_for('register') }}">
        <input type="hidden" name="role" id="selected_role" value="volunteer">
        <div class="reg_label">
            <h2>Регистрация</h2>
        </div>
        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}
        <div class="role-switch" aria-label="Выбор типа регистрации">
            <button class="role-option role-option-active" type="button" data-role="volunteer" aria-pressed="true">
                Волонтёр
            </button>
            <button class="role-option" type="button" data-role="organization" aria-pressed="false">Организация</button>
        </div>
        <div class="role-content role-content-active" data-content="volunteer">
            <div class="volunteer-fields">
                <label class="form-field" for="first_name">
                    <span>Имя</span>
                    <input type="text" id="first_name" name="first_name" placeholder="Введите ваше имя"
                           autocomplete="given-name" required>
                </label>
                <label class="form-field" for="last_name">
                    <span>Фамилия</span>
                    <input type="text" id="last_name" name="last_name" placeholder="Введите вашу фамилию"
                           autocomplete="family-name" required>
                </label>
                <label class="form-field" for="email">
                    <span>Почта</span>
                    <input type="text" id="email" name="email" placeholder="Введите почту"
                           autocomplete="email" required>
                </label>
                <label class="form-field" for="password">
                    <span>Пароль</span>
                    <input type="password" id="password" name="password" placeholder="Введите пароль"
                           autocomplete="new-password" required>
                </label>
                <label class="form-field" for="about_self">
                    <span>О себе</span>
                    <textarea id="about_self" name="info" placeholder="Расскажите о себе" rows="5"
                              required></textarea>
                </label>
                <label class="form-field" for="birthday">
                    <span>Дата рождения</span>
                    <input type="date" id="birthday" name="birth_date" placeholder="Введите дату рождения"
                           autocomplete=""
                           required>
                </label>
                <label class="form-field" for="number">
                    <span>Телефон</span>
                    <input type="tel" id="number" name="phone_number" placeholder="Введите номер телефона"
                           autocomplete="tel"
                           required>
                </label>
            </div>
        </div>

        <div class="role-content" data-content="organization">
            <div class="volunteer-fields">
                <label class="form-field" for="name_org">
                    <span>Название организации</span>
                    <input type="text" id="name_org" name="name" placeholder="Введите название организации" required disabled>
                </label>
                <label class="form-field" for="email_org">
                    <span>Почта</span>
                    <input type="text" id="email_org" name="email" placeholder="Введите почту" required
                           autocomplete="email" disabled>
                </label>
                <label class="form-field" for="password_org">
                    <span>Пароль</span>
                    <input type="password" id="password_org" name="password" placeholder="Введите пароль" required
                           autocomplete="new-password" disabled>
                </label>
                <label class="form-field" for="about_org">
                    <span>Информация</span>
                    <textarea id="about_org" name="info" placeholder="Расскажите об организации" rows="5"
                              required disabled></textarea>
                </label>
                <label class="form-field" for="number_org">
                    <span>Телефон</span>
                    <input type="tel" id="number_org" name="phone_number" placeholder="Введите номер телефона" required
                           autocomplete="tel" disabled>
                </label>
                <label class="form-field" for="number_org">
                    <span>Адрес</span>
                    <input type="text" id="address" name="address" placeholder="Введите адрес" required autocomplete="" disabled>
                </label>
            </div>
        </div>
        <button class="auth_button" type="submit">Зарегистрироваться</button>
    </form>
</section>

<script>
    const registerForm = document.getElementById('register_form');
    const selectedRoleInput = document.getElementById('selected_role');

    function setRegisterRole(selectedRole, shouldNotifyBackend = true) {
        selectedRoleInput.value = selectedRole;
        registerForm.action = `${registerForm.dataset.registerUrl}?state=${selectedRole}`;

        document.querySelectorAll('.role-option').forEach((item) => {
            const isActive = item.dataset.role === selectedRole;
            item.classList.toggle('role-option-active', isActive);
            item.setAttribute('aria-pressed', String(isActive));
        });

        document.querySelectorAll('.role-content').forEach((content) => {
            const isActive = content.dataset.content === selectedRole;
            content.classList.toggle('role-content-active', isActive);
            content.querySelectorAll('input, textarea, select').forEach((field) => {
                field.disabled = !isActive;
            });
        });

        if (shouldNotifyBackend) {
            fetch(`${registerForm.dataset.registerUrl}?state=${selectedRole}`, {
                method: 'GET',
                headers: {'X-Requested-With': 'fetch'}
            });
        }
    }

    document.querySelectorAll('.role-option').forEach((button) => {
        button.addEventListener('click', () => {
            setRegisterRole(button.dataset.role);
        });
    });

    setRegisterRole(selectedRoleInput.value, false);
</script>
{% endblock content %}
