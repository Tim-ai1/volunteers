{% extends 'base.html' %}

{% block hero %}{% endblock %}

{% block content %}
<section class="auth-page">
    <form class="auth-card" action="{{ url_for('login') }}" method="post">
        <input type="hidden" name="role" id="selected_role" value="volunteer">
        <div class="reg_label">
            <h2>Вход</h2>
        </div>
        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}
        <div class="role-content role-content-active" data-content="volunteer">
            <div class="volunteer-fields">
                <label class="form-field" for="email">
                    <span>Почта</span>
                    <input type="text" id="email" name="email" placeholder="Введите почту"
                           autocomplete="email" required>
                </label>
                <label class="form-field" for="password">
                    <span>Пароль</span>
                    <input type="password" id="password" name="password" placeholder="Введите пароль"
                           autocomplete="current-password" required>
                </label>
            </div>
        </div>
        <button class="auth_button" type="submit">Войти</button>
    </form>
</section>
{% endblock content %}
