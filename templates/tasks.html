{% extends "./base.html" %}

{% block hero %}{% endblock %}

{% block content %}
<h1 id="vol-events">Мероприятия для волонтёров</h1>
<div id="div-task">
{% for task in tasks %}

    <h2>{{ task.name }}</h2>
    {% if task and task.url_pic %}
        <img src="{{ url_for('static', filename=task.url_pic) }}" alt="Фотография не загружена">
    {% else %}
        <p>Фотография отсутствует</p>
    {% endif %}
    <a class="btn btn-primary" href="#">Принять участие</a>
{% endfor %}
</div>
{% endblock %}
