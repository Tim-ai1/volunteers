<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Волонтёриум — код подтверждения</title>
</head>
<body style="margin: 0; padding: 24px 16px; background-color: #eef3f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.4; color: #1a2a2a;">
  <div style="max-width: 460px; margin: 0 auto; background-color: #FFFFFF; border-radius: 32px; overflow: hidden;">
    <div style="padding: 40px 24px 44px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px;">
        <span style="font-size: 18px; font-weight: 500; letter-spacing: -0.3px; color: #096B68;">Волонтёриум</span>
        <div style="width: 6px; height: 6px; background-color: #90D1CA; border-radius: 10px;"></div>
      </div>

      <div style="text-align: center;">
        <div style="font-size: 28px; font-weight: 620; color: #096B68; margin-bottom: 12px; letter-spacing: -0.5px;">Код подтверждения</div>
        <div style="font-size: 15px; color: #129990; margin-bottom: 32px;">Введите этот код для завершения регистрации</div>

        <div style="background: #F5FBF9; border-radius: 28px; padding: 28px 16px; border: 1px solid #90D1CA;">
          <div style="font-size: 13px; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; color: #129990; margin-bottom: 16px;">ваш одноразовый код</div>
          <div style="font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 36px; font-weight: 600; letter-spacing: 6px; color: #096B68; background: #FFFFFF; display: inline-block; padding: 12px 20px; border-radius: 56px; border: 1px solid #90D1CA; word-break: keep-all; white-space: nowrap;">
            {{code}}
          </div>
        </div>
      </div>

      <div style="margin-top: 32px; padding-top: 24px; text-align: center; border-top: 1px solid #90D1CA;">
        <div style="font-size: 12px; color: #129990;">Волонтёриум</div>
      </div>
    </div>
  </div>
</body>
</html>
