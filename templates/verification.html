{% extends "base.html" %}

{% block hero %}{% endblock %}

{% block content %}
<section class="auth-page">
    <form class="auth-card verification-card" method="post">
        {{ form.hidden_tag() }}

        <div class="reg_label">
            <h2>Подтверждение регистрации</h2>
        </div>

        <p class="verification-text">
            Введите 6-значный код подтверждения, чтобы создать аккаунт.
        </p>

        {% if error %}
            <p class="auth-error">{{ error }}</p>
        {% endif %}

        <label class="form-field verification-code-field" for="code">
            <span>{{ form.code.label.text }}</span>
            {{ form.code(id="code", placeholder="000000", maxlength="6", autocomplete="one-time-code") }}
        </label>

        {{ form.submit(class="auth_button") }}
    </form>
</section>
{% endblock %}
